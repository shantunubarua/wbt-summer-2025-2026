<!DOCTYPE html>
<html>

<head>

</head>

<body>
    <h1>Donor Information</h1>
    <table>
        <tr>
            <td><label for="First Name* ">First Name*</label> </td>
            <td><input type="text" id=" First Name" name="First Name" required></td>
        </tr>
        <tr>
            <td><label for="Last Name* ">Last Name*</label> </td>
            <td><input type="text" id=" Last Name" name="Last Name" required></td>
        </tr>
        <tr>
            <td><label for="Company ">Company</label> </td>
            <td><input type="text" id=" Company" name="Company" required></td>
        </tr>
        <tr>
            <td><label for="Adress 1* ">Adress 1*</label> </td>
            <td><input type="text" id=" Adress 1" name="Adress 1" required></td>
        </tr>
        <tr>
            <td><label for="Adress 2* ">Adress 2*</label> </td>
            <td><input type="text" id=" Adress 2" name="Adress 2" required></td>
        </tr>
        <tr>
            <td><label for="City* ">City*</label> </td>
            <td><input type="text" id=" City" name="City" required></td>
        </tr>
        <tr>
            <td><label for="State* ">State*</label></td>
            <td>
                <select id="State* " name="state*" required>
                    <option value="">Select a State</option>
                    <option value="Dhaka">Dhaka</option>
                    <option value="Chattogram">Chattogram</option>
                    <option value="Sylhet">Sylhet</option>
                </select>
            </td>
        </tr>
        <tr>
            <td><label for="Zip Code* ">Zip Code*</label> </td>
            <td><input type="text" id=" Zip Code" name="Zip Code" required></td>
        </tr>
        <tr>
            <td><label for="Country* ">Country*</label></td>
            <td>
                <select id="Country* " name="Country*" required>
                    <option value="">Select a Country</option>
                    <option value="Australia">Australia</option>
                    <option value="Bangladesh">Bangladesh</option>
                    <option value="USA">USA</option>
                </select>
            </td>
        </tr>
        <tr>
            <td><label for="Phone ">Phone</label> </td>
            <td><input type="number" id=" Phone" name="Phone" required></td>
        </tr>
        <tr>
            <td><label for="Fax ">Fax</label> </td>
            <td><input type="number" id=" Fax" name="Fax" required></td>
        </tr>
        <tr>
            <td><label for="Email* ">Email*</label> </td>
            <td><input type="text" id=" Email" name="Email" required></td>
        </tr>
        <tr>
            <td><label>Donation Amount *</label>(Check a button or type in your amount)</td>
            <td>
                <input type="radio" name="donation" value="none"> None
                <input type="radio" name="donation" value="50"> $50
                <input type="radio" name="donation" value="75"> $75
                <input type="radio" name="donation" value="100"> $100
                <input type="radio" name="donation" value="250"> $250
                <input type="radio" name="donation" value="other"> Other
            </td>
        </tr>
        <tr>
            <td></td>
            <td><label for="otherAmount">Other Amount $</label>
                <input type="number" id="otherAmount" name="otherAmount" step="0.01">
            </td>
        </tr>
        <tr>
            <td><label for="recurring">Recurring Donation</label>(check if yes)</td>
            <td>
                <input type="checkbox" id="recurring" name="recurring">
                I am interested in giving on a regular basis.
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                Monthly Credit Card $
                <input type="number" name="monthlyAmount" style="width:80px;">
                For
                <input type="number" name="months" style="width:60px;">
                Months
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </td>
        </tr>
    </table>
</body>

</html>
